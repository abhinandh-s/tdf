name: Rust

on:
  push:
    branches: ["release"]
    tags: ["v*.*.*"]
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
      #    - { os: "macos-latest", target: "aarch64-apple-darwin" }
          - { os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu" }
       #   - { os: "windows-latest", target: "x86_64-pc-windows-msvc", ext: ".exe" }
       #   - { os: "ubuntu-24.04-arm", target: "aarch64-unknown-linux-gnu" }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup rust cache action
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install build dependencies on Ubuntu
        if: contains(matrix.os, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libfontconfig1-dev libgoogle-perftools-dev google-perftools
          version: 1.0

      - name: Build
        run: cargo build --release -F epub

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          # Cargo places 'production' profile builds in target/release
          cp "target/release/tdf${{ matrix.ext }}" dist/tdf-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdf-${{ matrix.target }}
          path: dist/tdf*

  tag-release:
    name: Release on tag push
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/*
          # Cleaned up the prerelease logic
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
